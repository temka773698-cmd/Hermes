<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-агент по насосам</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <p class="badge">MVP web-агента</p>
        <h1>Подбор насоса: сбор заявки</h1>
        <p class="subtitle">Агент задаёт первичные вопросы и передаёт менеджеру готовую заявку.</p>
      </div>
      <div class="notice">Не финальный инженерный подбор. Менеджер проверит данные.</div>
    </section>

    <section class="chat-card">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-form">
        <input id="message-input" autocomplete="off" placeholder="Например: нужен насос для скважины 50 метров" />
        <button type="submit">Отправить</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
